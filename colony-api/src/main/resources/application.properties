# Spring Application Name & JMX
spring.application.name=colonyconnect
spring.jmx.enabled=true

# Database Configuration (Auto-detects Postgres/Oracle based on URL)
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//oradevdb.hpcl.co.in:1551/oradevdb}
spring.datasource.username=${DB_USERNAME:orainfo}
spring.datasource.password=${DB_PASSWORD:information1}

# SAP Data Source Configuration
spring.sap.datasource.url=${SAP_URL:jdbc:sqlserver://sapindb-ag-lsnr.jade.hpcl.in:16080;databaseName=ERPINTDB}
spring.sap.datasource.username=${SAP_USERNAME:lameuser}
spring.sap.datasource.password=${SAP_PASSWORD:lameuser}
spring.sap.datasource.schema=${SAP_SCHEMA:MANDT300}
spring.sap.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration

# Server Configuration
server.port=8083
server.servlet.context-path=/colonyconnectapi

# Logging
logging.level.com.hpcl.colony=INFO
logging.level.org.springframework.security=DEBUG

# Actuator / Management
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# JMX Remote
java.rmi.server.hostname=127.0.0.1

# Application External Integrations
app.ldap.url=ldap://ldap.hpcl.co.in:389
app.ldap.base=${LDAP_BASE:}
app.ldap.user-dn=${LDAP_USER_DN:}
app.ldap.password=1234
app.sso.url=${SSO_URL:}
app.sso.client-id=${SSO_CLIENT_ID:}
app.sso.client-secret=${SSO_CLIENT_SECRET:}
app.email.host=${EMAIL_HOST:}
app.email.port=${EMAIL_PORT:587}
app.email.username=${EMAIL_USERNAME:}
app.email.password=${EMAIL_PASSWORD:}
app.sms.endpoint=${SMS_ENDPOINT:}
app.sms.api-key=${SMS_API_KEY:}
app.storage.path=${STORAGE_PATH:/data/attachments}
app.security.pin=${SECURITY_LOGIN_PIN:1234}
app.jwt.secret=${JWT_SECRET:ColonyConnectSecretKeyForJWTTokenGeneration2026!@#$%^&*()}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:8080,https://webtestkube.hpcl.co.in,https://colonyconnect.hpcl.co.in}
